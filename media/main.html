<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{styleUri}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:; font-src {{cspSource}};" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>CodeCoach</title>
</head>
<body>
  <!-- 顶部 Header（吸顶） -->
  <header id="header">
    <div class="header-row">
      <h1 class="title">CodeCoach</h1>
      <div class="badges">
        <span class="badge" id="streak-badge" hidden>🔥 0</span>
        <span class="badge" id="level-badge">Lv.1</span>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-label" id="progress-label">0 / 0 题</div>
  </header>

  <!-- 中间 可滚动内容区 -->
  <main id="content">
    <!-- 空态/引导 -->
    <section id="onboarding" class="card">
      <h2>欢迎使用 CodeCoach</h2>
      <p>AI 编程教练，陪你在 VS Code 里边学边练 Java。</p>
      <p class="muted" id="config-hint">尚未配置 API Key</p>
      <div class="row">
        <button class="btn btn-primary" data-cmd="startLesson">开始学习</button>
        <button class="btn btn-secondary" data-cmd="openSettings">配置</button>
      </div>
    </section>

    <!-- 讲解区 -->
    <section id="lesson" class="card" hidden></section>

    <!-- 练习题卡 -->
    <section id="exercise" class="card" hidden></section>

    <!-- 提示区（手风琴） -->
    <section id="hints" class="card" hidden></section>

    <!-- 反馈区（评测结果 + AI 点评气泡） -->
    <section id="feedback" hidden></section>
  </main>

  <!-- 底部 固定操作区（吸底） -->
  <footer id="footer" hidden>
    <div class="footer-row">
      <button class="btn btn-secondary" data-cmd="runTest">运行测试</button>
      <button class="btn btn-primary" data-cmd="submit">提交</button>
      <button class="btn btn-secondary" data-cmd="nextExercise">下一题</button>
    </div>
    <div class="footer-row" id="help-row">
      <input type="text" id="help-input" placeholder="卡住了？向 AI 提问…" />
      <button class="btn btn-secondary" data-cmd="askHelp">求助</button>
    </div>
  </footer>

  <script type="module" nonce="{{nonce}}" src="{{appUri}}"></script>
</body>
</html>
